ekf_localization:
  ros__parameters:
    # GENERAL SETTINGS
    frequency: 200.0
    two_d_mode: true                # 2D 평면 주행
    predict_to_current_time: true
    transform_time_offset: 0.0
    transform_timeout: 0.2
    print_diagnostics: true
    publish_tf: true


    # FRAME PARAMETERS
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # ODOMETRY INPUT (from Kinematics)
    odom0: /odom1
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,  # vx, vy velocity
                   false, false, true,   # yaw velocity
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 5

    # IMU INPUT (from IMU sensor)
    imu0: /imu/data
    imu0_config: [false, false, false,
                  true,  true,  true,   # roll, pitch, yaw orientation
                  false, false, false,
                  true,  true,  true,   # roll, pitch, yaw angular velocity
                  true,  true,  true]
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true
    imu0_queue_size: 5

    # ODOMETRY INPUT (FAST_LIO)
    odom1: /Odometry
    odom1_config: [true,  true,  false,
                   false, false, false,
                   false, false, false,  # vx, vy velocity
                   false, false, false,   # yaw velocity
                   false, false, false]
    odom1_differential: false
    odom1_relative: false
    odom1_queue_size: 5