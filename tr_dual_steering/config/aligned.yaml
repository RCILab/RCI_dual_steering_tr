tr_dual_steering_node:
  ros__parameters:
    wheel_diameter: 0.32
    publish_rate_hz: 1000.0
    cmd_vel_topic: "/cmd_vel"
    steer_traj_topic: "/joint_trajectory_controller/joint_trajectory"
    drive_cmd_topic: "/velocity_controller/commands"
    wheel_type: 'aligned'
    module_names:  ["front", "rear"]
    steer_joints:  ["front_steer_joint", "rear_steer_joint"]
    drive_joints:  ["front_drive_joint", "rear_drive_joint"]
    module_x:      [0.46, -0.46]
    module_y:      [0.0,    0.0]
    caster_b_half: 0.3